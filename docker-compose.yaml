networks:
  devops:
    driver: bridge

volumes:
  lab03_pgdata:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:

services:
  db:
    image: postgres:17.6-alpine
    container_name: lab03-db
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_USER: lab03
      POSTGRES_PASSWORD: lab03
      POSTGRES_DB: lab03
    volumes:
      - lab03_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab03 -d lab03"]
      interval: 3s
      timeout: 3s
      retries: 20

  sonarqube:
    image: sonarqube:25.6.0.109173-community
    container_name: sonarqube-server
    ports:
      - 9000:9000
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - devops

  scanner:
    image: sonarsource/sonar-scanner-cli:latest
    profiles:
      - scan
    working_dir: /usr/src
    environment:
      SONAR_HOST_URL: http://sonarqube:9000
      SONAR_TOKEN: "${SONAR_TOKEN:-}"
    volumes:
      - .:/usr/src
    depends_on:
      - sonarqube
    networks:
      - devops
